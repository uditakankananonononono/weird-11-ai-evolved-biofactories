name: W11 A6 chunks (locked protocol)
on:
  workflow_dispatch:
  push:
    branches: ['a6-dispatch']
permissions:
  contents: write
jobs:
  a6-seed:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        target: ['14BDO', 'ISOBUTANOL', 'LYCOPENE']
        seed: [260927, 261927, 262927, 263927, 264927]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a6-dispatch
      - name: skip if target not dispatched
        id: gate
        run: |
          if grep -qx '${{ matrix.target }}' dispatch/targets.txt; then echo "run=yes" >> "$GITHUB_OUTPUT"; else echo "run=no" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'yes'
        with:
          python-version: '3.12'
      - if: steps.gate.outputs.run == 'yes'
        run: pip install cobra==0.32.1 scipy==1.15.3 numpy==2.2.6 optlang==1.9.1 swiglpk==5.0.13
      - name: restore checkpoint cache
        if: steps.gate.outputs.run == 'yes'
        uses: actions/cache@v4
        with:
          path: results/
          key: a6-${{ matrix.target }}-${{ matrix.seed }}-${{ github.run_attempt }}
          restore-keys: a6-${{ matrix.target }}-${{ matrix.seed }}-
      - name: run seed (bit-exact resume on re-run)
        if: steps.gate.outputs.run == 'yes'
        run: python src/search_a6.py ${{ matrix.target }} ${{ matrix.seed }} > results/a6_log_${{ matrix.target }}_${{ matrix.seed }}.txt 2>&1
      - name: upload results artifact
        if: steps.gate.outputs.run == 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: a6-${{ matrix.target }}-${{ matrix.seed }}
          path: |
            results/a6_runs.jsonl
            results/a6_cache_${{ matrix.target }}_*.json
            results/a6_log_${{ matrix.target }}_${{ matrix.seed }}.txt
          retention-days: 14
  aggregate:
    needs: a6-seed
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a6-dispatch
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/
      - name: single-writer commit
        run: |
          git config user.name 'w11-a6-bot'
          git config user.email 'a6-bot@localhost'
          dest=results_aggregated/${{ github.run_id }}
          mkdir -p "$dest"
          cp -r artifacts/* "$dest"/ 2>/dev/null || true
          git add "$dest"
          git commit -m 'aggregate a6 run ${{ github.run_id }}' || { echo 'nothing to commit'; exit 0; }
          ok=0
          for i in 1 2 3 4 5; do
            git pull --rebase origin a6-dispatch && git push origin HEAD:a6-dispatch && { ok=1; break; }
            git rebase --abort 2>/dev/null || true
            sleep 7
          done
          [ "$ok" = 1 ] || { echo 'PUSH FAILED'; exit 1; }
